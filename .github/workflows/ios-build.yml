name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Latest Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build Unsigned App
      run: |
        xcodebuild -project DelayCamera.xcodeproj \
          -scheme DelayCamera \
          -sdk iphoneos \
          -configuration Release \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

        mkdir -p Payload
        cp -r build/Release-iphoneos/DelayCamera.app Payload/
        zip -r DelayCamera.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DelayCamera-IPA
        path: DelayCamera.ipa
