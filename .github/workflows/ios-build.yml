name: Build iOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install XcodeGen
      run: brew install xcodegen

    - name: Generate Xcode Project
      run: xcodegen generate

    - name: Build Unsigned App
      run: |
        xcodebuild -project DelayCamera.xcodeproj \
          -scheme DelayCamera \
          -sdk iphoneos \
          -configuration Release \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

        # 빌드된 .app을 IPA 압축 파일로 묶기
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/DelayCamera.app Payload/
        zip -r DelayCamera.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: DelayCamera-IPA
        path: DelayCamera.ipa
